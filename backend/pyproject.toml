[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "spendpilot"
version = "0.1.0"
description = "SpendPilot foundation: identity, isolation, and the application shell."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.1.1",
  "greenlet==3.5.6",
  "alembic==1.20.0",
  "psycopg[binary,pool]==3.3.6",
  "uvicorn==0.54.0",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.1",
  "email-validator==2.3.0",
  "procrastinate==3.10.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
documents = [
  "pypdf==6.19.0",
  "pikepdf==10.15.0",
  "pdfplumber==0.11.10",
  "ocrmypdf==17.13.0",
]
agents = [
  "langchain==1.4.3",
  "langgraph==1.2.12",
  "deepagents==0.7.19",
]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
