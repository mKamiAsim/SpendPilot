name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SPENDPILOT_PROVIDER: fake
      MODEL_SMOKE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.20"
      - name: Install English and Arabic OCR packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev --extra agents --extra documents
      - name: Run pytest on the fake provider
        working-directory: backend
        run: uv run pytest -q
